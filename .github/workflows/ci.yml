name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify Bun executable
        env:
          FLOW_BUN_EXECUTABLE: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          expected_sha256="9fd36f87e4b90b07632b987a2e4ec81ca15a62c81bf983190cea6d715be2ad74"
          actual_sha256="$(sha256sum "$FLOW_BUN_EXECUTABLE" | cut --delimiter=' ' --fields=1)"
          test "$actual_sha256" = "$expected_sha256"
          printf 'FLOW_BUN_EXECUTABLE=%s\n' "$FLOW_BUN_EXECUTABLE" >> "$GITHUB_ENV"

      - name: Install sandbox system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep
          # GitHub's ephemeral Ubuntu 24.04 runner otherwise strips the user-namespace
          # capabilities required by SRT's bubblewrap and seccomp layers.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage floors
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Test compiled process behavior
        run: npm run test:runtime

      - name: Smoke-test compiled CLI
        run: |
          node dist/cli/main.js --help
          node dist/cli/main.js validate examples/verify-foundation.workflow.yaml
          runs_dir="$(mktemp -d)"
          node dist/cli/main.js run examples/verify-foundation.workflow.yaml --run-id ci-smoke --runs-dir "$runs_dir"
          node dist/cli/main.js inspect ci-smoke --runs-dir "$runs_dir"

      - name: Verify installable package
        run: npm run pack:check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
