name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install sandbox system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep
          # GitHub's ephemeral Ubuntu 24.04 runner otherwise strips the user-namespace
          # capabilities required by SRT's bubblewrap and seccomp layers.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage floors
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Test compiled process behavior
        run: npm run test:runtime

      - name: Smoke-test compiled CLI
        run: |
          node dist/cli/main.js --help
          node dist/cli/main.js validate examples/verify-foundation.workflow.yaml
          runs_dir="$(mktemp -d)"
          node dist/cli/main.js run examples/verify-foundation.workflow.yaml --run-id ci-smoke --runs-dir "$runs_dir"
          node dist/cli/main.js inspect ci-smoke --runs-dir "$runs_dir"

      - name: Verify installable package
        run: |
          package_dir="$(mktemp -d)"
          tarball="$(npm pack --pack-destination "$package_dir")"
          npm install --ignore-scripts --prefix "$package_dir/consumer" "$package_dir/$tarball"
          help_output="$("$package_dir/consumer/node_modules/.bin/flow" --help)"
          [[ "$help_output" == *"flow validate"* ]]

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
