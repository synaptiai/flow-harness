name: Native observer qualification

on:
  push:
    branches:
      - codex/issue-197-native-qualification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-observer-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-observer-development:
    name: Native observer development (not full CI)
    runs-on: ubuntu-24.04
    # Two observer and two relay builds each allow ten minutes, plus preparation.
    timeout-minutes: 50
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm

      - name: Verify source and native Linux x64 identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          node -e 'if (process.platform !== "linux" || process.arch !== "x64") process.exit(1)'
          test "$(id -u)" -ne 0
          uname -r
          node --version
          /usr/bin/python3 -I -S --version

      - name: Install the existing sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap gcc ripgrep socat util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          gcc --version
          realpath /usr/bin/socat

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Build the production runtime
        run: npm run build

      - name: Compare two clean observer builds and separate failure controls
        run: |
          node native/verification-observer/build.mjs --build-observer-failure-controls "$RUNNER_TEMP/flow-native-observer"
          cat "$RUNNER_TEMP/flow-native-observer/build-evidence.json"

      - name: Test the host bridge owner release contract
        env:
          FLOW_TEST_HOST_BRIDGE_GUARDIAN: ${{ runner.temp }}/flow-native-observer/flow-host-bridge-guardian
        run: npm run test:runtime -- test/runtime/host-bridge-guardian.runtime.test.ts

      - name: Test active bridge descendants
        env:
          FLOW_TEST_HOST_BRIDGE_GUARDIAN: ${{ runner.temp }}/flow-native-observer/flow-host-bridge-guardian
        run: npm run test:runtime -- test/runtime/host-bridge-descendants.runtime.test.ts

      - name: Test bridge startup cleanup
        env:
          FLOW_TEST_HOST_BRIDGE_GUARDIAN: ${{ runner.temp }}/flow-native-observer/flow-host-bridge-guardian
        run: npm run test:runtime -- test/runtime/host-bridge-startup.runtime.test.ts

      - name: Calibrate bridge settlement predicate
        env:
          FLOW_TEST_HOST_BRIDGE_GUARDIAN: ${{ runner.temp }}/flow-native-observer/flow-host-bridge-guardian
        run: npm run test:runtime -- test/runtime/host-bridge-predicate.runtime.test.ts

      - name: Acquire and check reviewed relay sources
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = join(process.env.RUNNER_TEMP, 'flow-relay-sources');
          mkdirSync(root, { mode: 0o700 });
          const manifest = JSON.parse(readFileSync('native/verification-relay/source-manifest.json', 'utf8'));
          for (const item of manifest.inputs) {
            execFileSync('curl', ['--fail', '--location', '--silent', '--show-error', '--proto', '=https', '--proto-redir', '=https', '--max-time', '45', '--output', join(root, item.path), item.url], { timeout: 50_000, stdio: 'inherit' });
          }
          NODE
          node native/verification-observer/build.mjs --check-relay-sources "$RUNNER_TEMP/flow-relay-sources"
          FLOW_TEST_RELAY_SOURCE_ROOT="$RUNNER_TEMP/flow-relay-sources" npm run test:runtime -- test/runtime/verification-relay-source.runtime.test.ts

      - name: Compare two clean static relay baseline builds
        run: |
          node native/verification-observer/build.mjs --build-relay-baseline "$RUNNER_TEMP/flow-relay-sources" "$RUNNER_TEMP/flow-relay-baseline"
          cat "$RUNNER_TEMP/flow-relay-baseline/build-evidence.json"
          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC "$RUNNER_TEMP/flow-relay-baseline/socat-static-baseline" -V

      - name: Test static relay baseline forwarding
        env:
          FLOW_TEST_HOST_BRIDGE_GUARDIAN: ${{ runner.temp }}/flow-native-observer/flow-host-bridge-guardian
          FLOW_TEST_HOST_BRIDGE_RELAY: ${{ runner.temp }}/flow-relay-baseline/socat-static-baseline
        run: npm run test:runtime -- test/runtime/host-bridge-guardian.runtime.test.ts

      - name: Test the native application-result path
        env:
          FLOW_TEST_NATIVE_OBSERVER_HELPER: ${{ runner.temp }}/flow-native-observer/flow-observer-apply-seccomp
          FLOW_TEST_NATIVE_OBSERVER_FALSE_NORMAL_HELPER: ${{ runner.temp }}/flow-native-observer/test-controls/false-normal/flow-observer-apply-seccomp-false-normal
        # The hosted parent can have inherited non-CLOEXEC pipes. Isolate only
        # the test child; never close or change the parent runner's descriptors.
        # This is not evidence of the native observer's own descriptor custody.
        run: >-
          /usr/bin/python3 -I -S -c 'import subprocess, sys; sys.exit(subprocess.call(sys.argv[1:], close_fds=True))'
          npm run test:runtime -- test/runtime/native-observer-transport.runtime.test.ts
