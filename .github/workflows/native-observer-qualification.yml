name: Native observer qualification

on:
  push:
    branches:
      - codex/issue-197-native-qualification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-observer-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-observer-development:
    name: Native observer development (not full CI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm

      - name: Verify source and native Linux x64 identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          node -e 'if (process.platform !== "linux" || process.arch !== "x64") process.exit(1)'
          test "$(id -u)" -ne 0
          uname -r
          node --version

      - name: Install the existing sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap gcc ripgrep socat util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          gcc --version

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Build the production runtime
        run: npm run build

      - name: Test the native application-result path
        run: npm run test:runtime -- test/runtime/native-observer-transport.runtime.test.ts
