name: Preview release

on:
  workflow_dispatch:
    inputs:
      publish_github:
        description: Publish the verified immutable GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      package-name: ${{ steps.release_identity.outputs.package-name }}
      package-version: ${{ steps.release_identity.outputs.package-version }}
      release-tag: ${{ steps.release_identity.outputs.release-tag }}
      archive-name: ${{ steps.release_identity.outputs.archive-name }}
      attestation-name: ${{ steps.release_identity.outputs.attestation-name }}
      release-title: ${{ steps.release_identity.outputs.release-title }}
      release-notes-path: ${{ steps.release_identity.outputs.release-notes-path }}
      npm-dist-tag: ${{ steps.release_identity.outputs.npm-dist-tag }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm

      - name: Resolve the preview release identity
        id: release_identity
        run: node scripts/resolve-preview-release-identity.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          successful_runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            --field branch=main \
            --field head_sha="$GITHUB_SHA" \
            --field status=completed \
            --field per_page=100 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful_runs" -ge 1

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run release-focused tests
        run: |
          npm run typecheck
          npx vitest run \
            test/unit/release/package-release-evidence.test.ts \
            test/unit/infrastructure/release/package-release-artifact.test.ts \
            test/unit/infrastructure/release/local-package-release-builder.test.ts \
            test/unit/infrastructure/release/package-release-command.test.ts \
            test/unit/infrastructure/release/package-release-verifier.test.ts \
            test/scaffold/package.test.ts \
            test/scaffold/community-files.test.ts \
            test/scaffold/library-api-assessment.test.ts \
            test/scaffold/preview-npm-stage-release.test.ts \
            test/scaffold/preview-npm-stage-workflow.test.ts \
            test/scaffold/preview-release-identity.test.ts \
            test/scaffold/preview-release-workflow.test.ts

      - name: Prepare the exact preview artifact
        env:
          ARCHIVE_NAME: ${{ steps.release_identity.outputs.archive-name }}
        run: |
          npm run release:prepare
          test -f "release/package/${ARCHIVE_NAME}"

      - name: Upload the exact preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-preview-package
          path: release/package/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 14

  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm

      - name: Install Ubuntu sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ca-certificates curl ripgrep socat util-linux
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Build the release verifier
        run: npm run build

      - name: Download the exact preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-preview-package
          path: release/package

      - name: Verify the installed preview package
        run: npm run release:verify

  attest:
    needs:
      - prepare
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the exact preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-preview-package
          path: release/package

      - name: Attest the preview archive and evidence
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/package/*

      - name: Name the attestation bundle
        env:
          ATTESTATION_NAME: ${{ needs.prepare.outputs.attestation-name }}
        run: |
          mkdir --parents release/attestation
          cp -- "${{ steps.provenance.outputs.bundle-path }}" \
            "release/attestation/${ATTESTATION_NAME}"

      - name: Upload the attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-preview-attestation
          path: release/attestation/${{ needs.prepare.outputs.attestation-name }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 14

  publish:
    needs:
      - prepare
      - verify
      - attest
    if: ${{ inputs.publish_github }}
    environment: preview-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      REPOSITORY_NAME: ${{ github.event.repository.name }}
      PACKAGE_NAME: ${{ needs.prepare.outputs.package-name }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      ARCHIVE_NAME: ${{ needs.prepare.outputs.archive-name }}
      ATTESTATION_NAME: ${{ needs.prepare.outputs.attestation-name }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release-title }}
      RELEASE_NOTES_PATH: ${{ needs.prepare.outputs.release-notes-path }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0

      - name: Download the exact preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-preview-package
          path: release/package

      - name: Download the attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-preview-attestation
          path: release/attestation

      - name: Require an unused release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api graphql \
            --field owner="$REPOSITORY_OWNER" \
            --field name="$REPOSITORY_NAME" \
            --field tag="$RELEASE_TAG" \
            --raw-field query='query($owner: String!, $name: String!, $tag: String!) {
              repository(owner: $owner, name: $name) { release(tagName: $tag) { id } }
            }' \
            --jq '.data.repository.release.id // ""')"
          if test -n "$release_id"; then
            printf 'Preview release identity already exists.\n' >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          if test -n "$remote_tag"; then
            printf 'Preview release tag already exists.\n' >&2
            exit 1
          fi
          npm_result="$(mktemp)"
          trap 'rm -f "$npm_result"' EXIT
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json > "$npm_result"; then
            printf 'Preview npm version already exists.\n' >&2
            exit 1
          fi
          NPM_RESULT="$npm_result" node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            let error;
            try {
              error = JSON.parse(readFileSync(process.env.NPM_RESULT, "utf8")).error;
            } catch {
              error = undefined;
            }
            if (error?.code !== "E404") {
              console.error("Preview npm identity could not be verified as unused.");
              process.exit(1);
            }
          '

      - name: Create the complete draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/package/${ARCHIVE_NAME}" \
            release/package/package-release-evidence.json \
            "release/attestation/${ATTESTATION_NAME}" \
            --draft \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_PATH"

      - name: Publish the immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease \
            --latest=false
