apiVersion: flow.synapti.ai/v1alpha1
kind: Workflow
metadata:
  id: agent-command
  description: Template for one command-capable coding turn followed by independent verification.
goal:
  apiVersion: flow.synapti.ai/v1alpha1
  kind: Goal
  metadata:
    id: command-assisted-change-is-verified
  outcome: The requested repository change passes deterministic verification.
  criteria:
    - id: tests-pass
      description: The repository test suite passes after the implementation.
      verifier: { nodeId: verify }
budget:
  maxNodeStarts: 2
  maxModelTokens: 100000
  maxCostUsd: 2
  maxExecutionMs: 600000
  maxArtifactBytes: 262144
nodes:
  - id: implement
    type: agent
    agent:
      prompt: Implement the requested repository change. Inspect the workspace, make precise edits, run the relevant checks with flow_exec, and report failures accurately. The downstream verifier owns acceptance.
      model:
        provider: anthropic
        id: claude-sonnet-4-5
        thinking: medium
      tools: [read, ls, edit, exec]
      timeoutMs: 300000
  - id: verify
    type: verifier
    dependsOn: [implement]
    verifier:
      kind: command
      command:
        executable: npm
        args: [test]
        timeoutMs: 120000
