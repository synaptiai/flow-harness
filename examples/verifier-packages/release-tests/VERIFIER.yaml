apiVersion: flow.synapti.ai/v1alpha1
kind: VerifierPackage
metadata:
  name: release-tests
  version: 1.0.0
  description: Verify that the configured Node.js runtime starts successfully.
  license: Apache-2.0
  compatibility: Requires Node.js 22.19 or newer.
spec:
  kind: command
  command:
    executable: node
    args: [--version]
    timeoutMs: 30000
